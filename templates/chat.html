<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <title>Общий чат</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <h1>Общий чат</h1>
    <nav>
      <ul>
        <li><a href="{{ url_for('groups') }}">Назад к разделам</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Отображение сообщений -->
    <div id="chat-window" style="height: 300px; overflow-y: auto; border:1px solid #ccc; padding:5px;">
      <!-- Сообщения будут добавляться сюда через JS -->
    </div>

    <!-- Поле ввода сообщения -->
    <input type="text" id="chat-input" placeholder="Введите сообщение...">
    <button id="send-btn">Отправить</button>
  </main>

  <!-- JS-скрипт чата -->
 <script>
  const chatInput = document.getElementById('chat-input');
  const sendButton = document.getElementById('send-btn');
  const chatWindow = document.getElementById('chat-window');

  // Функция для загрузки и вывода сообщений
  function fetchMessages() {
    fetch('/get_messages')
      .then(response => response.json())
      .then(data => {
        chatWindow.innerHTML = '';
        data.forEach(msg => {
          const div = document.createElement('div');
          div.textContent = msg.user + ': ' + msg.message;
          chatWindow.appendChild(div);
        });
        // Прокручиваем чат к последнему сообщению
        chatWindow.scrollTop = chatWindow.scrollHeight;
      });
  }

  // При загрузке страницы вызываем fetchMessages
  fetchMessages();
  // Обновляем чат каждые 3 секунды
  setInterval(fetchMessages, 3000);

  // Функция отправки сообщения
  function sendMessage() {
    const text = chatInput.value.trim();
    if (text !== '') {
      fetch('/send_message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === 'ok') {
          chatInput.value = '';
          fetchMessages();
        } else {
          alert('Ошибка: ' + result.message);
        }
      });
    }
  }

  // Клик на кнопку «Отправить»
  sendButton.addEventListener('click', () => {
    sendMessage();
  });

  // Нажатие Enter в поле чата
  chatInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault(); // отменяем стандартное поведение Enter (переход на новую строку)
      sendMessage();
    }
  });
</script>

</body>
</html>
