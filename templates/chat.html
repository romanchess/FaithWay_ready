<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <title>{{ _('Общий чат') }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles_phone.css') }}">


  <style>
        #chat-window {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 5px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
    }
    .chat-message {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 8px;
      background-color: #ececec;
      max-width: 70%;
    }
    .timestamp {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }
    .chat-user {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ _('Общий чат') }}</h1>
<nav>
  <ul>
    <li><a href="{{ url_for('groups') }}">{{ _('Назад к разделам') }}</a></li>
  </ul>
</nav>
</header>

<main>
  
  <div id="chat-window"></div>

  
  <input type="text" id="chat-input" placeholder="{{ _('Введите сообщение...') }}">
  <button id="send-btn">{{ _('Отправить') }}</button>

</main>

  <!-- JS-for  chat  -->
 <script>
  const chatInput = document.getElementById('chat-input');
  const sendButton = document.getElementById('send-btn');
  const chatWindow = document.getElementById('chat-window');

  // function message
  function fetchMessages() {
    fetch('/get_messages')
      .then(response => response.json())
      .then(data => {
        chatWindow.innerHTML = '';
        data.forEach(msg => {
      
          const div = document.createElement('div');
          div.classList.add('chat-message');
          div.innerHTML = `
            <div class="timestamp">${msg.timestamp}</div>
            <div class="chat-user">${msg.user}:</div>
            <div>${msg.message}</div>
          `;
          chatWindow.appendChild(div);
        });
              chatWindow.scrollTop = chatWindow.scrollHeight;
      })
      .catch(error => console.error("Error loading messages:", error));
  }


  fetchMessages();
 
  setInterval(fetchMessages, 3000);

  // Function send message
  function sendMessage() {
    const text = chatInput.value.trim();
    if (text !== '') {
      fetch('/send_message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === 'ok') {
          chatInput.value = '';
          fetchMessages();
        } else {
          alert('Error: ' + result.message);
        }
      })
      .catch(error => console.error("Error sending message:", error));
    }
  }

  // click send»
  sendButton.addEventListener('click', sendMessage);

  // Нажатие Enter в поле чата
  chatInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault(); // enter  for send
      sendMessage();
    }
  });
</script>

</body>
</html>
